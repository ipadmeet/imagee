<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Form WebApp</title>
    <!-- QRコード解析ライブラリを読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <!-- 画面キャプチャ用ライブラリを読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --nav-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--ios-bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        /* コンテンツエリア */
        .content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .tab-content.active {
            display: block;
        }
        /* タブバー (iOS風) */
        .tab-bar {
            height: 60px;
            background-color: var(--nav-bg);
            border-top: 1px solid #d1d1d6;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-item {
            flex: 1;
            text-align: center;
            color: #8e8e93;
            font-size: 11px;
            cursor: pointer;
            border: none;
            background: none;
            padding: 5px 0;
        }
        .tab-item.active {
            color: var(--ios-blue);
        }
        .tab-icon {
            font-size: 22px;
            display: block;
            margin-bottom: 2px;
        }
        /* スキャナー画面 */
        #scanner-view {
            background: #000;
        }
        #video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* WEBビュー画面 */
        #web-view-container {
            width: 100%;
            height: 100%;
            background: #fff;
            position: relative;
        }
        #web-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* アルバム画面 */
        #album-view {
            overflow-y: auto;
            padding: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .grid-item {
            aspect-ratio: 1 / 1;
            background: #e5e5ea;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* トースト通知 */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 通知用トースト -->
    <div id="toast" class="toast"></div>

    <!-- メインコンテンツ -->
    <div class="content-area">
        
        <!-- タブ1: スキャナー / WEB表示（SwiftのContentView側に対応） -->
        <div id="tab-scanner" class="tab-content active">
            <!-- カメラプレビュー -->
            <div id="scanner-view" style="width:100%; height:100%;">
                <video id="video-preview" autoplay playsinline muted></video>
            </div>
            <!-- スキャン後にフォームを開く擬似WebView -->
            <div id="web-view-container" style="display: none;">
                <!-- 長押し判定のためのオーバーレイ層 -->
                <div id="longpress-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:10; cursor:pointer;"></div>
                <iframe id="web-frame" src=""></iframe>
            </div>
        </div>

        <!-- タブ2: アルバム (SwiftのAlbumViewに対応) -->
        <div id="tab-album" class="tab-content">
            <div id="album-view">
                <h3 style="margin-top:0;">保存されたスクショ</h3>
                <div class="grid" id="photo-grid">
                    <!-- キャプチャ画像がここに動的に追加されます -->
                </div>
            </div>
        </div>

    </div>

    <!-- ボトムナビゲーション -->
    <nav class="tab-bar">
        <button class="tab-item active" onclick="switchTab('scanner')">
            <span class="tab-icon">🔍</span>
            Scanner
        </button>
        <button class="tab-item" onclick="switchTab('album')">
            <span class="tab-icon">🖼️</span>
            Album
        </button>
    </nav>

    <script>
        const video = document.getElementById('video-preview');
        const scannerView = document.getElementById('scanner-view');
        const webViewContainer = document.getElementById('web-view-container');
        const webFrame = document.getElementById('web-frame');
        const longPressLayer = document.getElementById('longpress-layer');
        const photoGrid = document.getElementById('photo-grid');
        const toast = document.getElementById('toast');

        let streamRef = null;
        let scanAnimationId = null;

        // --- 1. カメラ・QRコードスキャン処理（解像度とピントの最適化版） ---
        async function startCamera() {
            stopCamera();

            const constraints = {
                video: {
                    facingMode: "environment", // 背面カメラ
                    width: { ideal: 1280 },    // 認識率を高める720p解像度
                    height: { ideal: 720 },
                    focusMode: "continuous"    // オートフォーカス
                },
                audio: false
            };

            try {
                streamRef = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = streamRef;
                video.setAttribute("playsinline", true);
                video.setAttribute("webkit-playsinline", true);
                
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                    setTimeout(() => {
                        scanAnimationId = requestAnimationFrame(tick);
                    }, 300);
                });
            } catch (err) {
                console.error("Camera error:", err);
                showToast("カメラの起動に失敗しました。HTTPS環境や権限を確認してください。");
            }
        }

        function stopCamera() {
            if (scanAnimationId) {
                cancelAnimationFrame(scanAnimationId);
                scanAnimationId = null;
            }
            if (streamRef) {
                streamRef.getTracks().forEach(track => track.stop());
                streamRef = null;
            }
        }

        function tick() {
            if (!streamRef || video.paused || video.ended) {
                scanAnimationId = requestAnimationFrame(tick);
                return;
            }

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement("canvas");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                try {
                    // jsQRで解析を実行
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });

                    if (code && code.data) {
                        showToast("🎉 QRコードを検出しました！");
                        stopCamera();
                        openWebView(code.data);
                        return; 
                    }
                } catch (e) {
                    console.error("jsQR error:", e);
                }
            }
            scanAnimationId = requestAnimationFrame(tick);
        }

        // --- 2. WEBビュー処理 & ロングプレス ---
        function openWebView(url) {
            scannerView.style.display = 'none';
            webViewContainer.style.display = 'block';
            webFrame.src = url;
        }

        // 1秒間の長押し判定（iOSのUILongPressGesture風）
        let pressTimer;
        longPressLayer.addEventListener('touchstart', (e) => {
            pressTimer = window.setTimeout(() => { captureWebView(); }, 1000); 
        });
        longPressLayer.addEventListener('touchend', () => clearTimeout(pressTimer));
        longPressLayer.addEventListener('touchmove', () => clearTimeout(pressTimer));
        
        // PCデバッグ用のマウス操作対応
        longPressLayer.addEventListener('mousedown', () => {
            pressTimer = window.setTimeout(() => captureWebView(), 1000);
        });
        longPressLayer.addEventListener('mouseup', () => clearTimeout(pressTimer));

        // --- 3. キャプチャ・保存処理（UIGraphicsImageRendererの代替） ---
        function captureWebView() {
            showToast("画面をキャプチャ中...");
            
            html2canvas(webViewContainer).then(canvas => {
                const imgDataUrl = canvas.toDataURL("image/png");
                
                // アルバムの先頭にグリッドアイテムを追加
                const div = document.createElement('div');
                div.className = 'grid-item';
                const img = document.createElement('img');
                img.src = imgDataUrl;
                div.appendChild(img);
                photoGrid.insertBefore(div, photoGrid.firstChild);
                
                showToast("📸 スクショをアルバムに保存しました！");
                
                // ブラウザ制限を回避し、端末に画像保存を促すダウンロード処理
                triggerDownload(imgDataUrl);
            });
        }

        function triggerDownload(dataUrl) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `screenshot_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // --- 4. タブ切り替え処理（TabViewの代替） ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));

            if (tabName === 'scanner') {
                document.getElementById('tab-scanner').classList.add('active');
                document.querySelectorAll('.tab-item')[0].classList.add('active');
                webViewContainer.style.display = 'none';
                scannerView.style.display = 'block';
                startCamera();
            } else if (tabName === 'album') {
                document.getElementById('tab-album').classList.add('active');
                document.querySelectorAll('.tab-item')[1].classList.add('active');
                stopCamera();
            }
        }

        function showToast(message) {
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        // ページロード時にカメラを起動
        window.onload = () => {
            startCamera();
        };
    </script>
</body>
</html>
